# Builds the image Mosher Labs' k3s cluster runs (homelab-gitops apps/garmin-mcp).
# Upstream publishes no image, so this fork builds one from this branch and pushes
# ghcr.io/benniemosher/garmin-mcp:mosher-labs-<short sha>. The cluster pins the digest.
name: Mosher Labs image

on:
  push:
    branches: [local/mosher-labs-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The cluster's nodes are amd64 only.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/benniemosher/garmin-mcp:mosher-labs-${{ steps.tag.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/benniemosher/garmin_mcp
            org.opencontainers.image.revision=${{ github.sha }}
